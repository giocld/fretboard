[package]
name = "gp-parser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gp-parser"
path = "src/main.rs"

[dependencies]
guitarpro = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Release binaries ship standalone (see .github/workflows/release.yml):
# drop debug symbols and enable full LTO for a smaller, faster artifact.
strip = true
lto = true
