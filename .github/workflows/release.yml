name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: gp-parser (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: statically linked musl binaries. Built in the rust:1
          # container with cargo-zigbuild (zig supplies the musl C
          # compiler/linker for both architectures, no system packages
          # needed; the guitarpro crate pulls in zstd-sys which compiles C).
          - name: linux-x86_64
            os: ubuntu-latest
            container: rust:1
            target: x86_64-unknown-linux-musl
            ext: ""
          - name: linux-aarch64
            os: ubuntu-latest
            container: rust:1
            target: aarch64-unknown-linux-musl
            ext: ""
          # macOS: native builds on Intel (macos-13) and Apple Silicon
          # (macos-14) runners; rustc can target both darwin ABIs.
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            ext: ""
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          # Windows: MSVC toolchain on the hosted runner.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (linux musl builds)
        if: matrix.container != ''
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl python3-pip xz-utils
          pip3 install --break-system-packages cargo-zigbuild
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /usr/local
          ln -sf /usr/local/zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        shell: bash
        working-directory: tools/gp-parser
        run: |
          if [ -n "${{ matrix.container }}" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "tools/gp-parser/target/${{ matrix.target }}/release/gp-parser${{ matrix.ext }}" \
             "dist/gp-parser-${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: gp-parser-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect artifacts and checksums
        shell: bash
        run: |
          mkdir -p release
          cp dist/gp-parser-* release/
          cd release
          sha256sum gp-parser-* > sha256sums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
